{#- Styles of the CSV pages (scoped .cv-*; tokens from app.css). Inline so the module stays self-contained. -#}
<style>
  .cv-header { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-5); }
  .cv-header__title { font-size: var(--text-2xl); font-weight: 680; letter-spacing: -0.01em; }
  .cv-header__sub { margin-top: 2px; color: var(--text-muted); }
  .cv-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); gap: var(--sp-5); align-items: start; }
  .cv-card { border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
  .cv-card__head { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-5) var(--sp-5) 0; }
  .cv-card__icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--primary-soft); color: var(--primary-fg); flex-shrink: 0; }
  .cv-card__icon--alt { background: var(--info-soft); color: var(--info-fg); }
  .cv-card__title { font-size: var(--text-lg); font-weight: 680; }
  .cv-card__sub { color: var(--text-muted); font-size: var(--text-sm); }
  .cv-card__body { padding: var(--sp-4) var(--sp-5) var(--sp-5); }
  .cv-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .cv-step { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: var(--sp-4); padding-bottom: var(--sp-5); }
  .cv-step:last-child { padding-bottom: 0; }
  .cv-step:not(:last-child)::before { content: ""; position: absolute; left: 15px; top: 36px; bottom: 6px; width: 2px; border-radius: 2px; background: var(--border); }
  .cv-step__num { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: var(--primary-contrast); font-weight: 700; font-size: var(--text-sm); }
  .cv-step__title { font-weight: 650; font-size: var(--text-md); margin-top: 5px; }
  .cv-step__text { color: var(--text-muted); font-size: var(--text-sm); margin-top: 4px; max-width: 64ch; }
  .cv-step__actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); margin-top: var(--sp-3); }
  .cv-help { margin-top: var(--sp-3); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  .cv-help > summary { display: flex; align-items: center; gap: var(--sp-2); padding: 10px 14px; cursor: pointer; list-style: none; font-weight: 600; font-size: var(--text-sm); color: var(--primary-fg); }
  .cv-help > summary::-webkit-details-marker { display: none; }
  .cv-help > summary .cv-chev { margin-left: auto; transition: transform var(--dur) var(--ease); color: var(--text-subtle); }
  .cv-help[open] > summary .cv-chev { transform: rotate(180deg); }
  .cv-help .table-wrap { border: 0; border-top: 1px solid var(--border); border-radius: 0 0 var(--radius) var(--radius); }
  .cv-help .table th:first-child, .cv-help .table th:last-child { border-radius: 0; }
  .cv-help code, .cv-code { font-family: var(--font-mono); font-size: 12px; padding: 1px 6px; border-radius: 5px; background: var(--surface-3); color: var(--text); white-space: nowrap; }
  .cv-drop { position: relative; cursor: pointer; padding: var(--sp-5) var(--sp-4); }
  .cv-drop:hover { border-color: var(--primary); }
  .cv-drop:focus-within { border-color: var(--primary); box-shadow: var(--ring); }
  .cv-drop input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .cv-drop__icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--surface); color: var(--primary-fg); box-shadow: var(--shadow-xs); }
  .cv-drop__title { font-weight: 650; color: var(--text); }
  .cv-drop__file { font-weight: 650; color: var(--primary-fg); }
  .cv-note { display: flex; align-items: flex-start; gap: 6px; color: var(--text-subtle); font-size: var(--text-xs); }
  .cv-note .icon { flex-shrink: 0; margin-top: 1px; }
  .cv-export { display: flex; flex-direction: column; gap: var(--sp-4); }
  .cv-export__dates { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
  .cv-export .btn { align-self: flex-start; }
  .cv-result { margin-bottom: var(--sp-5); }
  .cv-result .alert__actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; }

  /* Preview */
  .cv-summary { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-bottom: var(--sp-4); }
  .cv-summary .kpi-tile { min-width: 190px; align-items: flex-start; text-align: left; }
  .cv-summary .kpi-tile--muted { --tile-bg: var(--surface-3); --tile-ink: var(--text); }
  .cv-notices { display: flex; flex-direction: column; gap: var(--sp-2); margin-bottom: var(--sp-4); }
  .cv-table-wrap { max-height: none; }
  .cv-table td { vertical-align: top; }
  .cv-table tr.is-empty td { color: var(--text-subtle); background: var(--surface-2); }
  .cv-table tr.is-error td { background: color-mix(in srgb, var(--danger-soft) 70%, var(--surface)); }
  .cv-table tr.is-off td:not(:first-child) { opacity: 0.5; }
  .cv-col-check { width: 44px; }
  .cv-col-line { width: 56px; color: var(--text-subtle); font-variant-numeric: tabular-nums; }
  .cv-when { white-space: nowrap; font-weight: 600; }
  .cv-when small { display: block; font-weight: 500; color: var(--text-subtle); }
  .cv-text { max-width: 420px; }
  .cv-text p { margin: 0; overflow-wrap: anywhere; }
  .cv-thumbs { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .cv-thumbs img, .cv-thumbs .cv-thumb-ph { width: 36px; height: 36px; border-radius: 7px; object-fit: cover; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--border); }
  .cv-nets { display: flex; flex-direction: column; gap: 6px; }
  .cv-net { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: var(--text-xs); font-weight: 600; color: var(--text-muted); }
  .cv-issues { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-width: 420px; }
  .cv-issue { display: flex; gap: 6px; align-items: flex-start; font-size: var(--text-xs); line-height: 1.4; }
  .cv-issue .icon, .cv-issue .net-icon { flex-shrink: 0; margin-top: 1px; }
  .cv-issue--error { color: var(--danger-fg); }
  .cv-issue--warning { color: var(--warning-fg); }
  .cv-footer {
    position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap;
    margin-top: var(--sp-4); padding: var(--sp-3) var(--sp-5); border: 1px solid var(--border); border-radius: var(--radius-lg);
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); box-shadow: var(--shadow-md);
  }
  .cv-footer__consent { flex: 1 1 320px; min-width: 0; }
  .cv-footer__actions { display: flex; gap: var(--sp-2); margin-left: auto; }
  .cv-footer .check__label a { color: var(--primary-fg); text-decoration: underline; }
  @media (max-width: 1100px) { .cv-grid { grid-template-columns: minmax(0, 1fr); } }
  @media (max-width: 640px) { .cv-export__dates { grid-template-columns: 1fr; } }
</style>
